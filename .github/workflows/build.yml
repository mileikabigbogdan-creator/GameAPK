name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y build-essential ccache git libffi-dev libssl-dev python3-dev openjdk-17-jdk unzip
        pip install --user buildozer cython virtualenv
    - name: Build APK
      run: |
        export PATH=$PATH:$HOME/.local/bin
        buildozer -v android debug
    - uses: actions/upload-artifact@v4
      with:
        name: MyGame-APK
        path: bin/*.apk
